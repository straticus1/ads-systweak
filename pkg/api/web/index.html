<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After Dark System Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">AD</div>
                <h1>System Tools</h1>
            </div>
            <nav class="nav-menu">
                <button class="nav-item active" data-tab="tweaks">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
                    Built-in Tweaks
                </button>
                <button class="nav-item" data-tab="defaults">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22h14a2 2 0 0 0 2-2V7.5L14.5 2H6a2 2 0 0 0-2 2v4"/></svg>
                    Defaults Editor
                </button>
            </nav>
            <div class="sidebar-footer">
                <p>After Dark Security</p>
                <p class="version">v1.2.0-beta</p>
            </div>
        </aside>

        <main class="content-area">
            <!-- TWEAKS TAB -->
            <section id="tweaks-tab" class="tab-pane active">
                <header class="page-header">
                    <h2>System Tweaks</h2>
                    <div class="search-box">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        <input type="text" id="tweak-search" placeholder="Search tweaks...">
                    </div>
                </header>
                <div class="scroll-container">
                    <div id="tweaks-list" class="tweaks-grid">
                        <!-- Rendered via JS -->
                    </div>
                </div>
            </section>

            <!-- DEFAULTS EDITOR TAB -->
            <section id="defaults-tab" class="tab-pane">
                <header class="page-header">
                    <h2>macOS Defaults Editor</h2>
                    <div style="flex:1"></div>
                    <button id="btn-restore-all" class="btn secondary" style="color:var(--danger); border-color:var(--danger);">Restore All Backups</button>
                </header>
                <div class="scroll-container defaults-layout">
                    <div class="defaults-sidebar">
                        <div class="search-box">
                            <input type="text" id="domain-search" placeholder="Filter domains...">
                        </div>
                        <ul id="domain-list">
                            <li class="loading">Loading domains...</li>
                        </ul>
                    </div>
                    <div class="defaults-content">
                        <div id="domain-header" class="domain-header">
                            <h3>Select a domain</h3>
                            <button id="btn-add-key" class="btn primary" disabled>Add Key</button>
                        </div>
                        <div class="search-box key-search-box">
                            <input type="text" id="key-search" placeholder="Search keys in domain..." disabled>
                        </div>
                        <div class="table-container">
                            <table id="keys-table" class="data-table">
                                <thead>
                                    <tr>
                                        <th>Key</th>
                                        <th>Type</th>
                                        <th>Value</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr class="empty-state">
                                        <td colspan="4">No domain selected</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modals -->
    <div id="add-key-modal" class="modal">
        <div class="modal-content">
            <h3>Add / Edit Defaults Key</h3>
            <div class="form-group">
                <label>Domain</label>
                <input type="text" id="modal-domain" disabled>
            </div>
            <div class="form-group">
                <label>Key Name</label>
                <input type="text" id="modal-key" placeholder="e.g. AppleShowAllFiles">
            </div>
            <div class="form-group">
                <label>Type</label>
                <select id="modal-type">
                    <option value="string">String</option>
                    <option value="bool">Boolean</option>
                    <option value="int">Integer</option>
                    <option value="float">Float</option>
                </select>
            </div>
            <div class="form-group">
                <label>Value</label>
                <input type="text" id="modal-value" placeholder="Value">
            </div>
            <div class="modal-actions">
                <button class="btn secondary" id="btn-modal-cancel">Cancel</button>
                <button class="btn primary" id="btn-modal-save">Save</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Action completed</div>

    <script src="app.js"></script>
</body>
</html>
